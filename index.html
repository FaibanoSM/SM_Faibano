<!DOCTYPE html>
<html lang="it">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faibano S.M.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero-container">
        <nav class="navbar">
            <div class="logo-container">
                <img src="Logo.png" alt="Logo Squadra" class="logo-img">
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="squadra.html">Squadra</a></li>
            </ul>
        </nav>
    
        <img src="Gruppo.jpg" alt="Sfondo squadra" class="immagine-sfondo">
    </header>

    <section class="prossima-partita-section">
        <h2>Prossima Partita</h2>
        <div id="info-partita" class="card-partita">
            <!-- Qui dentro caricheremo i dati da Google Sheets -->
            <p>Caricamento in corso...</p>
        </div>
    </section>

    <div class="content-grid">
        <!-- Colonna 1/3: Classifica -->
        <div class="colonna-classifica">
            <section class="classifica-section">
                <h2>Classifica</h2>
                <div class="table-container">
                    <table class="tabella-classifica">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Squadra</th>
                                <th>G</th>
                                <th>PT</th>
                                <th>GF</th>
                                <th>GS</th>
                                <th>DR</th>
                            </tr>
                        </thead>
                        <tbody id="corpo-classifica">
                            <!-- Le righe verranno riempite dal JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- Colonna 2/3: Incontri -->
        <div class="colonna-futura">
            <section class="incontri-section">
                <h2 class="titolo-incontri">Incontri</h2>
                
                <!-- Unico contenitore griglia per ordinare le giornate correttamente sia su PC che su mobile -->
                <div class="incontri-grid" id="incontri-container">
                    <!-- Le giornate verranno inserite qui dal JS in ordine cronologico -->
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
